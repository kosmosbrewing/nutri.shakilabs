<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4d7c0f" />
    <link
      rel="preload"
      href="/fonts/Pretendard-Regular-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GmarketSansBold-brand-v1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>멀티비타민 가격·영양 비교 | ShakiLabs</title>
    <meta
      name="description"
      content="일반 성인용 멀티비타민의 1일 비용과 영양성분 충족도를 같은 기준으로 비교합니다."
    />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9470410471278501" crossorigin="anonymous" data-adsense="true"></script>

    <script>
      // 사이트 전역 테마 키(v3 §6.10) — shakilabs.com/* 전체가 같은 origin이라 앱마다
      // 다른 키를 쓰면 앱을 넘나들 때 테마가 리셋된다. hydration 전에 .dark를 붙여야
      // 첫 페인트에서 테마가 깜빡이지 않는다.
      (() => {
        try {
          const key = "shakilabs:theme:v1";
          const saved = localStorage.getItem(key);
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";

          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = theme;
        } catch {
          // no-op
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
